career-profile:
    title: Career Profile
    summary: |
      Software Engineer with 5 years of professional experience building and maintaining
      business-critical systems, primarily in the banking and public sector. Works across the
      full stack with Java, Go, and React, and across the full software development lifecycle,
      from requirements analysis and implementation to production support. Holds an MSc in
      Computer Engineering from FER, University of Zagreb, and started working professionally
      while still a student. Focused on delivering reliable, maintainable software and on
      continuous learning through certifications, AI-assisted development, and personal and
      DIY projects.
education:
    title: Education
    info:
      - degree: MSc in Computer Engineering, univ. mag. ing. comp.
        university: Faculty of Electrical Engineering and Computing (FER), University of Zagreb
        time: 2018 - 2023
        details: |
          Completed coursework that strengthened expertise in software development, with a focus on
          Object-Oriented Programming, Android Application Development, Expert Java course (led by Marko Čupić),
          Web and Mobile Software Development, and Artificial Intelligence.
      - degree: Gymnasium
        university: High school Ivanec
        time: 2014 - 2018
        details: |
          Participated in several inter-county competitions, festivals, and summer camps in STEM-related fields,
          including a national mathematics competition. Further developed mathematical knowledge through weekly
          advanced classes at the Center of Excellence in Varaždin.
experiences:
    title: Experience
    info:
      - role: Software Engineer
        time: May, 2026 - Present
        company: BGW Electronics
        details: |
            Software Engineer in a true full stack role, covering backend, frontend, DevOps, and AI.
            Designs, builds, and maintains both internal applications and solutions for external clients,
            owning them end to end, from architecture and implementation to deployment and operations.
            Applies AI in day-to-day development and integrates it into the delivered solutions.
      - role: Full Stack Developer
        time: Oct, 2021 - Apr, 2026
        company: True North
        details: |
            Full Stack Developer working with Go, Java, and React on projects across several industries,
            including banking and the public sector. Combined hands-on development with a consultative approach,
            helping clients define requirements and shaping them into effective software solutions. Worked on both
            backend and frontend components throughout the full software development lifecycle, from requirements
            analysis and implementation to maintenance and production support. Collaborated closely with clients and
            internal teams to understand business needs, improve existing systems, and deliver reliable, scalable solutions.
        projects:
        - name: RBA.hr
          time: Oct, 2023 - Apr, 2026
          details: |
            Full Stack Developer in the Card Issuing team, developing and maintaining a new card platform
            within the RBA Croatia group. Implemented new features, took part in platform migration activities,
            and handled daily incidents and production support. Helped keep the platform stable and supported
            business-critical processes in a complex banking environment.
        - name: HZMO
          time: Dec, 2022 - Feb, 2023
          details: |
            Developed an application for HZMO (Croatian Pension Insurance Institute) that calculates a user's
            share of a family pension. As the sole frontend developer, owned the entire frontend implementation
            and gained valuable insight into the business processes behind the application.
        - name: AKD Squid2
          time: Oct, 2021 - Oct, 2023
          details: |
            Worked on a large-scale, microservices-based system for card issuing and production management.
            Contributed to both backend and frontend development, implementing new features, maintaining
            existing functionality, and continuously improving the system. Gained experience in designing and
            building reliable, scalable software in a demanding domain while following development best practices.
